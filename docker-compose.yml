# Demo OptiBayer dengan SATU perintah:
#
#   docker compose up --build        -> API :8000 + React :3000
#
# Sebelum ini juri harus menyalakan dua proses manual (uvicorn + next dev) dan
# memastikan Python 3.12 + Node 20 terpasang benar di mesinnya.

services:
  api:
    build: .
    image: optibayer-api
    ports:
      # Port HOST bisa diganti kalau bentrok dgn proyek lain:
      #   API_PORT=8100 WEB_PORT=3200 docker compose up
      - "${API_PORT:-8000}:8000"
    environment:
      # Asal frontend yang boleh memanggil API (lihat CORS di src/integration/api.py).
      # IKUT WEB_PORT secara otomatis. Ini penting: kalau nilainya dipaku ke 3000
      # sementara seseorang menyalakan UI di port lain karena bentrok, halaman
      # tetap terbuka tapi SEMUA data kosong dengan status "API terputus" —
      # gagal senyap yang sulit didiagnosis saat demo.
      CORS_ORIGINS: "${CORS_ORIGINS:-http://localhost:${WEB_PORT:-3000},http://127.0.0.1:${WEB_PORT:-3000}}"
      # Isi kalau instance ini dipublikasikan: endpoint tulis akan menuntut
      # header X-Write-Token yang sama.
      # OPTIBAYER_WRITE_TOKEN: "ganti-saya"
      LLM_PROVIDER: "${LLM_PROVIDER:-template}"
      GROQ_API_KEY: "${GROQ_API_KEY:-}"
      GEMINI_API_KEY: "${GEMINI_API_KEY:-}"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8000/v1/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  web:
    build:
      context: ./frontend
      args:
        # Cadangan yang DITANAM saat build (lib/api.ts memakainya kalau env
        # runtime di bawah tidak diisi).
        NEXT_PUBLIC_API_URL: "${NEXT_PUBLIC_API_URL:-http://localhost:8000}"
    image: optibayer-web
    ports:
      - "${WEB_PORT:-3000}:3000"
    environment:
      # Alamat API dibaca SAAT RUNTIME (disuntik server ke halaman lewat
      # app/layout.tsx), sama seperti render.yaml. Artinya alamat backend bisa
      # diganti cukup dengan restart container — tanpa build ulang image.
      #
      # Harus alamat yang bisa dijangkau dari BROWSER pengguna, bukan nama
      # service internal 'api': permintaan berangkat dari mesin pengguna,
      # bukan dari dalam jaringan compose.
      OPTIBAYER_API_URL: "${OPTIBAYER_API_URL:-http://localhost:8000}"
    depends_on:
      api:
        condition: service_healthy
