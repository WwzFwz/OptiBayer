[project]
name = "optibayer"
version = "0.1.0"
description = "OptiBayer — Bayer Process Advisor + CRO Console (ANTAM Hackathon)"
requires-python = ">=3.11"

[tool.pytest.ini_options]
# rootdir eksplisit + testpaths supaya `pytest` (tanpa -m) menemukan src/.
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q --strict-markers"
markers = [
    "slow: uji yang berjalan lama, mis. melatih ulang model (pytest -m 'not slow' untuk melewatinya)",
]
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore::UserWarning",
]

[tool.ruff]
line-length = 95
target-version = "py311"
exclude = ["frontend", "notebooks", ".venv", "data"]


[tool.ruff.lint]
select = [
    "E",    # pycodestyle
    "F",    # pyflakes
    "I",    # isort — urutan impor
    "UP",   # pyupgrade
    "B",    # bugbear — jebakan umum
    "C4",   # comprehension
]
ignore = [
    "E501",  # panjang baris diurus formatter, bukan error
    "B008",  # Depends()/Body() di default argumen = pola sah FastAPI
]

[tool.ruff.lint.per-file-ignores]
# Tes boleh memakai fixture pytest yang "tidak terpakai" secara statis
# dan menyentuh helper privat modul yang diujinya.
"tests/*" = ["F811", "ARG001", "SLF001"]
