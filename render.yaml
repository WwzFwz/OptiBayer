# Blueprint deploy OptiBayer di Render (free tier) — juri cukup dapat LINK.
#
# Pakai:
#   1. Push repo ini ke GitHub.
#   2. Render Dashboard -> New -> Blueprint -> pilih repo ini.
#   3. Render membaca berkas ini dan menyalakan kedua service sekaligus.
#   4. Setelah backend hidup, salin URL-nya ke env OPTIBAYER_API_URL milik
#      service web. Nilai itu dibaca SAAT RUNTIME (disuntik server ke halaman,
#      lihat frontend/src/app/layout.tsx), jadi cukup restart — tidak perlu
#      build ulang image.
#
# Catatan free tier: instance tidur setelah ~15 menit menganggur dan butuh
# ~30-60 detik untuk bangun. Sebelum sesi penjurian, buka link-nya sekali
# supaya sudah panas.

services:
  # ---------------------------------------------------------------- backend
  - type: web
    name: optibayer-api
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    plan: free
    region: singapore          # paling dekat ke Indonesia
    healthCheckPath: /v1/health
    envVars:
      # Isi dgn domain frontend setelah service web punya URL.
      - key: CORS_ORIGINS
        value: https://optibayer-web.onrender.com
      # WAJIB diisi kalau instance ini publik: endpoint tulis (knowledge/add,
      # audit/decision) akan menuntut header X-Write-Token yang sama.
      - key: OPTIBAYER_WRITE_TOKEN
        generateValue: true
      - key: LLM_PROVIDER
        value: template        # default offline; ganti + isi kunci kalau mau LLM

  # --------------------------------------------------------------- frontend
  - type: web
    name: optibayer-web
    runtime: docker
    dockerfilePath: ./frontend/Dockerfile
    dockerContext: ./frontend
    plan: free
    region: singapore
    envVars:
      # Dibaca runtime — aman diubah tanpa build ulang.
      - key: OPTIBAYER_API_URL
        value: https://optibayer-api.onrender.com
